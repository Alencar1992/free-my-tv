# Free My TV settings. build.sh copies this file to config.properties the first time; edit that one and rebuild.

# Legacy upstream setting. This fork uses the optional YouTube feed instead of TMDB picks.
tmdb_key=

# Legacy TMDB region; retained for build compatibility, unused by this fork.
tmdb_region=US

# Your city, for the weather and the sunset that turns the home screen dark at night (decimal degrees).
latitude=40.7128
longitude=-74.0060
# Optional: the name shown on the weather card (empty = "Weather").
city=

# auto (follows the TV), en or pt
language=auto

# Legacy setting; this fork does not fetch cryptocurrency prices.
show_crypto=false

# Optional personal server. Empty by default: skins and apps work without a feed.
# See docs/feed-pessoal.md. Google credentials stay on your server, never in the APK.
channel_feed_url=
show_channel_metrics=false

# Legacy currency; unused by this fork.
currency=USD

# C, F, or auto (Fahrenheit when the TV is set to the US)
temperature=auto

# true also turns off Google Assistant ("Ok Google"); the remote's mic button stops working
disable_assistant=false
